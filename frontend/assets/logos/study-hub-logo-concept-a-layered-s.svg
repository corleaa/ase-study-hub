<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="40" y1="28" x2="216" y2="228" gradientUnits="userSpaceOnUse">
      <stop stop-color="#403A3F"/>
      <stop offset="1" stop-color="#262126"/>
    </linearGradient>
    <linearGradient id="pageA" x1="52" y1="68" x2="202" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7E9DB"/>
      <stop offset="1" stop-color="#E6CBB5"/>
    </linearGradient>
    <linearGradient id="accentA" x1="88" y1="74" x2="180" y2="182" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4A172"/>
      <stop offset="1" stop-color="#DD7C58"/>
    </linearGradient>
    <filter id="shadowA" x="22" y="18" width="212" height="220" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F0A0F" flood-opacity="0.26"/>
    </filter>
    <!-- R letterform mask -->
    <mask id="maskA">
      <rect width="256" height="256" fill="black"/>
      <rect x="34" y="34" width="188" height="188" rx="48" fill="white"/>
      <!-- R glyph cut-out (white = show bars through here) -->
      <!-- Left vertical stem -->
      <rect x="70" y="64" width="32" height="128" rx="4" fill="black"/>
      <!-- Upper bowl of R -->
      <path d="M102 64 H154 C172 64 186 78 186 96 C186 114 172 128 154 128 H102 Z" fill="black"/>
      <!-- Hole inside bowl -->
      <path d="M102 80 H150 C162 80 170 87 170 96 C170 105 162 112 150 112 H102 Z" fill="white"/>
      <!-- Diagonal leg of R -->
      <path d="M134 128 L186 192 L160 192 L108 128 Z" fill="black"/>
    </mask>
  </defs>

  <!-- Background box -->
  <g filter="url(#shadowA)">
    <rect x="34" y="34" width="188" height="188" rx="48" fill="url(#bgA)"/>
    <rect x="34.75" y="34.75" width="186.5" height="186.5" rx="47.25" stroke="#6C626A" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>

  <!-- Layered bars visible through mask -->
  <g mask="url(#maskA)">
    <rect x="56" y="64" width="140" height="36" rx="18" fill="url(#pageA)"/>
    <rect x="48" y="110" width="148" height="36" rx="18" fill="url(#pageA)" fill-opacity="0.94"/>
    <rect x="60" y="156" width="140" height="36" rx="18" fill="url(#pageA)" fill-opacity="0.88"/>
  </g>

  <!-- Accent dots (same position as original) -->
  <path d="M174 61C174 56.0294 178.029 52 183 52H190C194.971 52 199 56.0294 199 61V68H174V61Z" fill="url(#accentA)"/>
  <path d="M57 188H82V195C82 201.627 76.6274 207 70 207H69C62.3726 207 57 201.627 57 195V188Z" fill="url(#accentA)"/>
</svg>
